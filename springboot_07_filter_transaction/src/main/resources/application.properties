spring.application.name=springboot_07_filter_transaction

#TODO 002 application.properties 설정

#기본포트 8080 변경 => 8099
server.port=8099

#Datasource
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=EDU
spring.datasource.password=EDU

#Mybatis Alias 설정
mybatis.type-aliases-package=com.min.edu.vo

#Mybatis xml mapper 설정
mybatis.mapper-locations=classpath:sqls/*.xml

#thymeleaf 설정(캐쉬설정, 인코딩설정)
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

#MyBatis 로그 처리
logging.level.org.mybatis=DEBUG
logging.level.org.apache.ibatis=DEBUG
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl