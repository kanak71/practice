<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>그룹 채팅 참여 인원</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>
<!-- TODO 015 그룹 채팅화면 window open -->
<script type="text/javascript">
	function goSocket(gr_id, mem_id){
		window.open("./socketOpen.do?gr_id="+gr_id+"&mem_id"+mem_id, 
					"그룹채팅",
					"width=600px, height=800px, left=300px, top=50px");
		}
	
</script>

<!-- TODO 014 참여자 목록 -->
<body>
	<div class="container">
		<fieldset>참여자 목록</fieldset>
		<div>
			<ul>
				<li>
					<button class="btn btn-success" onclick="goSocket('S', 'super')">그룹S | 사용자 super</button>
				</li>
				
				<li>
					<button class="btn btn-success" onclick="goSocket('S', 'higher')">그룹S | 사용자 higher</button>
				</li>
			</ul>
			
			
			<ul>
				<li>
					<button class="btn btn-primary" onclick="goSocket('H', 'super')">그룹S | 사용자 super</button>
					</li>
				<li>
					<button class="btn btn-primary" onclick="goSocket('H', 'top')">그룹S | 사용자 top</button>
					</li>
			</ul>
		</div>
	</div>
	
</body>
</html>
