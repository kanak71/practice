<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>글작성 화면</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>
<!-- TODO 044 글작성 화면 -->
	<div class="container">
		<form th:action="@{/insertBoard.do}" method="post">
			<div class="form-group">
				<label for="id">아이디</label>
				<div class="form-control" th:text="${session.loginVo.id}"></div>
			</div>
			<div class="form-group">
				<label for="title"></label>
				<input class="form-control" id="title" name="title" required="required">
			</div>
			<div class="form-group">
				<label for="content"></label>
				<textarea class="form-control" rows="5" id="content" name="content" required="required"></textarea>
			</div>
			<!-- TODO 045 글작성 버튼 -->
			<button class="btn btn-success" type="submit">글작성</button>
			<button class="btn btn-default" onclick="history.back(-1)">취소</button>
		</form>
	</div>
</body>
</html>
