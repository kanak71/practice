<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>회원검색, 회원리스트</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

</head>
<body>
	<div class="container">
		<!-- TODO 070 회원 검색 -->
		<fieldset>
			<legend>회원검색</legend>
			<!-- autocomplete="on" 브라우저가 입력값을 자동완성 -->
			<form name="search-frm" autocomplete="on">
			
				<select name="opt" id="type">
					<option value="id">아이디</option>
					<option value="name">성명</option>
				
				</select>
				
				<input type="text" name="keyword" id="keyword" placeholder="검색어를 입력해 주세요">
				
				<!-- TODO 071 회원 검색 버튼 -->
				<input type="button" value="검색" onclick="getSearchUser(event)">
			</form>	 
			
			<hr>
			<div>
				<h4>검색된 회원정보</h4>
				<div id="viewDetail"></div>
			</div>
		</fieldset>
	
	<!-- TODO 069 회원 전체 조회 리스트 화면 -->
		<h4>[관리자] 회원관리 전체 조회</h4>
		<table class="table table-hover">
			<thead>
				<tr>
					<th>번호</th>
					<th>아이디</th>
					<th>이름</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="vo, vs: ${userList}">
					<td th:text="${vs.index}"></td>
					<td th:text="${vo.id}"></td>
					<td th:text="${vo.name}"></td>
				</tr>
			</tbody>
		</table>
	</div>
</body>
<!-- TODO 072 회원검색 이벤트 javascript -->
<script type="text/javascript">
	function getSearchUser(event){
		console.log(event);
		event.preventDefault();
		
		const opt = document.getElementById("opt");
		const keyword = document.getElementById("keyword").value;
		const optValue = opt.options[opt.selectIndex].value;
		
		//1. 서버로 보낼 데이터를 FormDate 혹은 URLSearchParams로 구성
		const params = new URLSearchParams();
		params.append('opt',optValue);
		params.append('keyword', keyword);
		
		//2. fetch 호출
		fetch('./getSearchUser.do',{
			method: 'post',
			headers: {
				'Content-Type':'application/x-www-form-urlencoded'	//폼데이터 형식 지정
			},
			body:params // opt=값&keyword=값
		})
		.then(response =>{
			if(!response.ok){
				throw new Error("네트워크 응답 에러 500");
			}
			return response.json();	//응답 데이터를 JSON 객체로 변환
		})
		.then(msg=>{
			console.log(typeof msg, msg);
			let html = `<table class='table table-hover>'`;
			
			msg.forEach((value, index)=>{
				html += `
						<tr>
							<td>${index+1}</td>
							<td>${value.id}</td>
							<td>${value.name}</td>
						</tr>
				`;
			});
			
			html += `</table>`;
			document.getElementById("viewDetail").innerHTML=html;
		})
		.catch(error=>{
			console.log("Fetch에러", error);
			alert("잘못된 요청처리");
		});
	}
</script>
</html>
