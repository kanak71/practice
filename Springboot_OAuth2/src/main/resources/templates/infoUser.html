<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>사용자 정보</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        .profile-container { display: flex; flex-direction: column; align-items: center; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; margin-bottom: 10px; border: 1px solid #ccc; }
        table { margin: 20px auto; border-collapse: collapse; width: 50%; }
        th, td { padding: 10px; border: 1px solid #ddd; }
        th { background-color: #f4f4f4; width: 30%; }
    </style>
</head>
<body>
    <h2>네이버 로그인 사용자 정보</h2>
    
    <div class="profile-container" th:if="${user != null}">
        <img class="profile-img" 
             th:src="${user.profileImage != null ? user.profileImage : '/images/default-profile.png'}" 
             alt="프로필 사진">
        
        <h3><span th:text="${user.name}">이름</span> / <span th:text="${user.nickname}">닉네임</span></h3>
    </div>

    <table th:if="${user != null}">
        <tr>
            <th>이메일</th>
            <td th:text="${user.email}">example@naver.com</td>
        </tr>
        <tr>
            <th>성별</th>
            <td th:text="${user.gender == 'M' ? '남성' : (user.gender == 'F' ? '여성' : '미선택')}"></td>
        </tr>
        <tr>
            <th>생일</th>
            <td th:text="${user.birthday}">01-01</td>
        </tr>
        <tr>
            <th>연령대</th>
            <td th:text="${user.ageRange}">20-29</td>
        </tr>
        <tr>
            <th>휴대전화</th>
            <td th:text="${user.phoneNumber}">010-0000-0000</td>
        </tr>
    </table>

    <div th:unless="${user != null}">
        <p>사용자 정보를 불러올 수 없습니다.</p>
    </div>

    <br>
    <a th:href="@{/}">홈으로</a> | 
    <a th:href="@{/logout}">로그아웃</a><br>
    <a th:href="@{/disconnect}">네이버 연결 끊기</a>
</body>
</html>
