<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>메일 작성 화면</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>
<body>
	<div class="container">
		<h4 class="text-center">메일 작성하기</h4>
		<form class="form-horisontal" action="./mailSender.do" method="post">
		 	<div class="form-group">
		 		<label class="control-label col-sm-2" for="email">TO:</label>
		 		<div class="col-sm-10">
		 			<input type="email" class="form-control" id="email" name="email" placeholder="받는사람">
		 		</div>
		 	</div>
		 	
		 	<div class="form-group">
		 		<label class="control-label col-sm-2" for="title">제목:</label>
		 		<div class="col-sm-10">
		 			<input class="form-control" id="title" name="title" placeholder="제목">
		 		</div>
		 	</div>
		 	
		 	<div class="form-group">
		 		<label class="control-label col-sm-2" for="content">내용:</label>
		 		<div class="col-sm-10">
		 			<textarea class="form-control" rows="10" id="content" name="content" placeholder="메일내용"></textarea>
		 		</div>
		 	</div>
		 	
		 	<div class="form-group">
		 		<label class="control-label col-sm-2" for="file">첨부파일</label>
		 		<div class="col-sm-10">
		 			<input class="form-control" type="file" id="file" name="attachFile" >
		 		</div>
		 	</div>
		 	
		 	<div class="form-group text-center">
		 		<input class="btn btn-success" type="submit" value="메일보내기">
		 		<input class="btn btn-danger" type="button" onclick="location.href='./'" value="취소">
		 	</div> 
		
		</form>
	</div>
	
</body>
</html>
