spring.application.name=spring_jpa_Relationship_cascadeType

#MySQL 접속정보 - DataSource
spring.datasource.url=jdbc:mysql://localhost:3307/student?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=test
spring.datasource.password=

#JPA 초기화 전략
# - update : 변경된 스키마 자동으로 반영
spring.jpa.hibernate.ddl-auto=update

#Hibernate JPA를 사용하여 DB에 맞는 SQL문을 생성하기 위한 Dialect(방언) 설정
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.show-sql=true